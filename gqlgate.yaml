# gqlgate configuration — THE file you edit. `docker compose up --build`
# compiles the gateway (including your hooks/ directory), introspects the
# schema below, and serves GraphQL + GraphiQL on http://localhost:8080/graphql.
#
# Out of the box this points at the compose-internal demo TiDB (service name
# `tidb`) seeded with a small blog schema. To use YOUR database: change
# database.* below and start only the gateway: `docker compose up --build gqlgate`
version: 1

database:
  host: tidb              # compose service name; change to your TiDB host
  port: 4000
  user: root
  password: ""
  schema: appdb           # the schema whose tables become the GraphQL API
  startup_wait_seconds: 60  # retry startup while the DB/seeder come up

server:
  host: 0.0.0.0
  port: 8080
  path: /graphql
  graphiql: true          # dev IDE on GET /graphql — turn off in production
  debug: true             # logs SQL, exposes DB errors — turn off in production
  hot_reload: true        # edit this file and save; no restart needed
  max_response_rows: 10000  # fail requests that would return more rows (0 = no limit)
  max_parallel_root_fields: 4  # independent query root fields run concurrently (1 = serial)
  cors:
    enabled: true
    allowed_origins: ["*"]

jwt:
  algorithm: HS256
  secret: ${GQLGATE_JWT_SECRET}
  role_lookup:            # role comes from the users table, not the token
    table: users
    id_claim: sub
    id_column: id
    role_column: role
    username_column: username
    password_column: password
    # Roles a user may switch to per request with the X-Gqlgate-Role header
    # (the role column above stays the default). In the seed, root (id 4,
    # admin) may act as author to see what authors see.
    allowed_roles_column: allowed_roles
  anonymous_role: anonymous
  leeway_seconds: 30

schema_gen:
  default_page_size: 25
  max_page_size: 200
  # Extra comparison operators for `where` ({column} is the quoted column,
  # each {value} a bound parameter), e.g. posts(where: {published_on: {_year_eq: 2026}}).
  custom_operators:
    - name: _year_eq
      argument: Int
      applies_to: [Date, DateTime]
      sql: "YEAR({column}) = {value}"
  # Row counts (posts_aggregate.count, total_count, affected_rows) as 64-bit
  # BigInt. Without this line they stay Int! (the backward-compatible default).
  count_type: BigInt
  # TiDB table/column COMMENTs become the GraphQL descriptions (opt-in: they
  # are visible to every role that can read the table).
  descriptions_from_comments: true

# Per-table modeling: logical keys for views / keyless tables, relationships
# without foreign keys, GraphQL names, descriptions and deprecations.
tables:
  post_stats:             # a view (see example/seed.sql)
    primary_key: [post_id]  # not enforced: gives post_stats_connection / _by_pk
    description: "Comment statistics per post."
    columns:
      comment_count: commentCount
    relationships:
      post: {type: object, target: posts, mapping: {post_id: id}}
  post_tags:              # a table without a primary key
    primary_key: [post_id, tag]
  posts:
    relationships:
      stats: {type: object, target: post_stats, mapping: {id: post_id}}
      tags: {type: array, target: post_tags, mapping: {id: post_id}}
  users:
    columns:
      metadata: {json_type: UserMetadata}   # typed instead of an opaque JSON value

# Shapes for JSON columns: users { metadata { tier tags } }
json_types:
  UserMetadata:
    description: "Profile data kept in users.metadata."
    fields:
      tier: String
      tags: "[String]"

# Custom logic lives in the hooks/ directory (compiled in on build; any Go
# library allowed). hooks/avatar.go.sample adds computed fields to the users
# type (avatar_url, published_posts): rename it to .go and rebuild. To
# activate the other sample, rename hooks/signup.go.sample to
# hooks/signup.go, rebuild, and uncomment the wiring below (the sample
# registers `validate_post`; its `signup` mutation mounts automatically):
# hooks:
#   tables:
#     posts:
#       before_insert: [validate_post]

roles:
  admin:
    tables:
      "*":
        select: true
        insert: true
        update: true
        delete: true
      post_stats:         # views are never covered by "*"
        select: true
      users:
        select:
          allow: true
          columns: [id, username, role, name, email, is_active, balance, metadata, created_at]
        insert: true
        update: true
        delete: true

  author:
    tables:
      users:
        select:
          allow: true
          columns: [id, name, is_active, created_at]
      posts:
        select: true
        insert:
          allow: true
          columns: [title, body, published, published_on]
          presets:
            author_id: ":jwt.sub"
        update:
          allow: true
          columns: [title, body, published, published_on]
          filter: "author_id = :jwt.sub"
        delete:
          allow: true
          filter: "author_id = :jwt.sub"
      comments:
        select: true
        insert:
          allow: true
          columns: [post_id, body]
          presets:
            user_id: ":jwt.sub"
          # every inserted comment must be on a post the author can see
          check: "post_id IN (SELECT id FROM posts WHERE published = 1 OR author_id = :jwt.sub)"
        delete:
          allow: true
          filter: "user_id = :jwt.sub OR post_id IN (SELECT id FROM posts WHERE author_id = :jwt.sub)"
      post_stats:
        select:
          allow: true
          filter: "author_id = :jwt.sub"
      post_tags:
        select: true

  anonymous:
    tables:
      posts:
        select:
          allow: true
          columns: [id, author_id, title, body, published_on, created_at]
          filter: "published = 1"
          # Public clients get an index-friendly filter surface: no
          # regex / LIKE scans, and body is readable but not filterable.
          filterable_columns:
            id: all
            author_id: all
            title: [_eq, _in, _starts_with, _istarts_with, _icontains]
            published_on: all
            created_at: all
      users:
        select:
          allow: true
          columns: [id, name]
      comments:
        select: true
      documents:
        select: true
      post_tags:
        select: true
      post_stats:
        select:
          allow: true
          columns: [post_id, comment_count]
          filter: "post_id IN (SELECT id FROM posts WHERE published = 1)"
